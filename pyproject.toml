[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-agent-client"
version = "0.1.4"
description = "CircuitAgent Community Edition: hardware DSL, LCSC live-selection client, and netlist contracts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sora" }]
keywords = ["eda", "pcb", "hardware", "llm", "kicad", "jlcpcb", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
circuit-agent-mcp = "client.mcp_server:run_stdio_server"

[project.urls]
Homepage = "https://github.com/mo9652962-ai/circuit-agent"
Issues = "https://github.com/mo9652962-ai/circuit-agent/issues"

[tool.setuptools]
packages = ["client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
