name: Publish to PyPI

# 打 v* tag（如 v0.1.0）或手动触发 → uv build → OIDC 免 token 发布。
# 前提（一次性）: PyPI 项目 Settings → Publishing 配 Trusted Publisher:
#   Owner=mo9652962-ai  Repository=circuit-agent  Workflow name=publish.yml  Environment=pypi
# 同时记得 bump pyproject 的 version——PyPI 不允许同版本重传。
# 发行名 = circuit-agent-client（PyPI 的 circuit-agent 相关名已核验可用）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# least-privilege：GITHUB_TOKEN 全局只读；publish job 单独声明 id-token（OIDC）
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run tests before publish
        run: uv run pytest -q --ignore=tests/test_routing_quality.py --ignore=tests/test_router_and_placement_advanced.py

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build sdist & wheel
        run: uv build

      - name: Generate SBOM (CycloneDX)
        run: uv run --with cyclonedx-py cyclonedx-py environment --output-format json --output-file sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.4.3（SHA 固定）
        with:
          name: sbom-cyclonedx
          path: sbom.json

      # pypi-publish 在 OIDC 模式下默认生成 PEP 740 attestations（provenance）
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
